version: '3.8'

services:
  redmine:
    image: redmine:5
    ports:
      - "3000:3000"
    environment:
      REDMINE_DB_POSTGRES: postgres
      REDMINE_DB_USERNAME: redmine
      REDMINE_DB_PASSWORD: password
      REDMINE_DB_DATABASE: redmine
      REDMINE_SECRET_KEY_BASE: supersecretkey
      # Enable plugin assets to be served
      RAILS_ENV: production
    volumes:
      - .:/usr/src/redmine/plugins/redmine_time_tracker
    restart: no
    depends_on:
      - postgres
    # We need to run bundle install to pick up plugin dependencies, 
    # and run migrations for the plugin.
    command: >
      bash -c "
        echo \"production:
          adapter: postgresql
          database: redmine
          host: postgres
          username: redmine
          password: password
          encoding: utf8\" > config/database.yml &&
        bundle config set --local without 'development test' &&
        bundle install &&
        bundle exec rake db:migrate RAILS_ENV=production &&
        bundle exec rake redmine:plugins:migrate RAILS_ENV=production &&
        rails server -b 0.0.0.0
      "

  postgres:
    image: postgres:14
    environment:
      POSTGRES_USER: redmine
      POSTGRES_PASSWORD: password
      POSTGRES_DB: redmine
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
